[project]
name = "checkout"
version = "0.1.0"
description = "Servico de Checkout - orquestrador da saga de compra (conference-back)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiokafka>=0.11",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "structlog>=24.1",
    "alembic>=1.13",
    "contracts",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A fixture "engine" (tests/conftest.py) e session-scoped; sem os dois ajustes
# abaixo, o loop de cada teste (escopo padrao "function") descasa do loop em
# que o engine foi construido, causando "Future attached to a different loop".
# Os dois precisam apontar para o mesmo escopo - so a fixture nao basta.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
# migrations/env.py e executado pela CLI do alembic ("alembic upgrade head"),
# nao pelo pytest - ja validado manualmente (ver README). Contá-lo no gate de
# cobertura penalizaria codigo de wiring que nao faz sentido exercitar via
# teste unitario/integracao.
omit = ["src/adapters/outbound/persistence/migrations/*"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src", "contracts"]
